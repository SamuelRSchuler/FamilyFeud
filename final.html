<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Feud - Final Round (2 Player)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="final-page">
<header><h1>Family <em>Feud</em></h1><span class="eyebrow">FINAL ROUND</span></header>
<main>
<section class="dashboard"><div class="score"><span class="label">FINAL ROUND POINTS</span><strong id="totalPoints" aria-live="polite">0</strong></div></section>
<div id="instructions">Click once to reveal the answer, again to reveal the points.</div>

<p id="error" role="alert" hidden></p>
<div id="board">
  <div class="player" id="player1">
    <h2>Player 1</h2>
  </div>
  <div class="player" id="player2">
    <h2>Player 2</h2>
  </div>
</div>

</main>
<script src="final-questions.js"></script>
<script>
  const questions = window.FEUD_FINAL_QUESTIONS;
  const validAnswer = item => item && typeof item.answer === "string" && item.answer.trim() &&
    Number.isFinite(item.points) && item.points >= 0;
  const valid = Array.isArray(questions) && questions.length > 0 && questions.every(item =>
    item && typeof item.question === "string" && item.question.trim() &&
    validAnswer(item.player1) && validAnswer(item.player2));

  let total = 0;
  const totalDisplay = document.getElementById("totalPoints");
  const p1Container = document.getElementById("player1");
  const p2Container = document.getElementById("player2");

  function renderPlayer(container, answers, prefix) {
    // remove old rows but keep header
    container.querySelectorAll(".row").forEach(el => el.remove());

    answers.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "row";
      row.setAttribute("role", "button");
      row.tabIndex = 0;
      row.setAttribute("aria-label", `Question ${i + 1}: reveal answer`);
      row.dataset.state = "hidden"; // hidden → answer → points
      row.dataset.answer = item.answer;
      row.dataset.points = item.points;
      row.dataset.prefix = prefix;

      row.innerHTML = `
        <div class="answer">${i + 1}. ---</div>
        <div class="points">---</div>
      `;

      row.onclick = () => advanceReveal(row);
      row.onkeydown = event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          advanceReveal(row);
        }
      };
      container.appendChild(row);
    });
  }

  function advanceReveal(row) {
    const state = row.dataset.state;
    if (state === "hidden") {
      row.querySelector(".answer").textContent = row.dataset.answer;
      row.dataset.state = "answer";
      row.setAttribute("aria-label", `${row.dataset.answer}: reveal points`);
      row.classList.add("revealed-answer");
    } else if (state === "answer") {
      row.querySelector(".points").textContent = row.dataset.points;
      row.dataset.state = "points";
      row.setAttribute("aria-label", `${row.dataset.answer}, ${row.dataset.points} points`);
      row.classList.remove("revealed-answer");
      row.classList.add("revealed-points");
      total += Number(row.dataset.points);
      updateTotal();
    }
  }

  function renderBoard() {
    total = 0;
    updateTotal();
    renderPlayer(p1Container, questions.map(item => item.player1), "p1");
    renderPlayer(p2Container, questions.map(item => item.player2), "p2");
  }


  function updateTotal() {
    totalDisplay.textContent = total;
  }

  if (valid) {
    renderBoard();
  } else {
    const error = document.getElementById("error");
    error.hidden = false;
    error.textContent = "Check final-questions.js: each entry needs a question and player1/player2 answers with nonnegative numeric points.";
  }
</script>
</body>
</html>
