<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Family Feud Board</title>
<style>
  body {
    background: radial-gradient(circle at top, #111 0%, #000 100%);
    color: white;
    font-family: 'Arial Black', sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
  }

  h1 {
    padding-top: 20px;
    color: gold;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #ff0;
  }

  #totalPoints {
    font-size: 40px;
    color: #00ffcc;
    margin-top: 10px;
    text-shadow: 0 0 8px #0ff;
  }

  #board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-gap: 10px;
    max-width: 700px;
    margin: 40px auto;
  }

  .answer {
    position: relative;
    background: #0033cc;
    border: 4px solid #fff;
    border-radius: 10px;
    height: 100px;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .answer.revealed {
    background: gold;
    color: black;
    font-weight: bold;
  }

  .score {
    position: absolute;
    right: 15px;
    bottom: 10px;
    font-size: 20px;
  }

  #controls {
    margin-top: 20px;
  }

  button {
    background: red;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 20px;
    padding: 10px 20px;
    margin: 5px;
    cursor: pointer;
  }

  button:hover {
    background: darkred;
  }
</style>
</head>
<body>
<h1>FAMILY FEUD</h1>
<div id="totalPoints">Total: 0</div>

<div id="board"></div>


<script>
  // Example answers for one question
  const answers = [
    { text: "Hatsune Miku", points: 48 },
    { text: "Gojo", points: 36 },
    { text: "Naruto", points: 36 },
    { text: "Luffy", points: 24 },
  ];

  let total = 0;
  const board = document.getElementById("board");
  const totalDisplay = document.getElementById("totalPoints");

  function renderBoard() {
    board.innerHTML = "";
    total = 0;
    updateTotal();
    answers.forEach((ans, index) => {
      const div = document.createElement("div");
      div.className = "answer";
      div.dataset.index = index;
      div.textContent = `${index + 1}`;
      div.onclick = () => revealAnswer(index);
      board.appendChild(div);
    });
  }

  function revealAnswer(index) {
    const div = board.children[index];
    const ans = answers[index];
    if (!div.classList.contains("revealed")) {
      div.classList.add("revealed");
      div.innerHTML = `${ans.text}<span class="score">${ans.points}</span>`;
      total += ans.points;
      updateTotal();
    }
  }

  function updateTotal() {
    totalDisplay.textContent = `Total: ${total}`;
  }

  // Initialize
  renderBoard();
</script>
</body>
</html>
