<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Feud • Game Night</title>
<link rel="stylesheet" href="styles.css">
<script src="questions.js" defer></script>
<script src="game.js" defer></script>
</head>
<body>
<header><span class="eyebrow">LET’S PLAY</span><h1>Family <em>Feud</em></h1><p>Survey says…</p></header>
<main>
<section class="teams" aria-label="Team scores">
<div class="team-panel" id="team-panel-0"><span class="label">TEAM 1</span><strong id="team-score-0" aria-live="polite">0</strong><button id="play-0" aria-pressed="true">Playing this round</button></div>
<div class="team-panel" id="team-panel-1"><span class="label">TEAM 2</span><strong id="team-score-1" aria-live="polite">0</strong><button id="play-1" aria-pressed="false">Select to play</button></div>
</section>
<section class="dashboard" aria-label="Round information">
<div><span class="label">ROUND</span><strong id="round-number">01</strong></div>
<div class="score"><span class="label">ROUND POINTS</span><strong id="score" aria-live="polite">0</strong></div>
<div><span class="label">STRIKES</span><strong id="strikes" aria-label="0 of 3 strikes">— — —</strong></div>
</section>
<section class="question-panel"><span class="eyebrow">NAME SOMETHING…</span><h2 id="question"></h2><p id="status" aria-live="polite">Click a card to reveal an answer.</p></section>
<section id="board" class="board" aria-label="Survey answers"></section>
<section class="award-panel" aria-label="Award round points">
<p id="award-status" aria-live="polite">Select the team playing, then award the round points to the winner.</p>
<div class="controls"><button id="award-0">Award points to Team 1</button><button id="award-1">Award points to Team 2</button><button id="undo-award" disabled>Undo award</button></div>
</section>
<div class="controls"><button id="wrong" class="wrong">✕ &nbsp; Wrong answer</button><button id="reset">Reset round</button><button id="next" class="next">Next question →</button></div>
<div class="game-reset"><button id="reset-game">Reset entire game</button></div>
<details><summary>Choose a question</summary><label for="question-select">Jump to round</label><select id="question-select"></select></details>
<p id="error" role="alert" hidden></p>
</main>
<footer>GAME NIGHT EDITION <span>•</span> Reveal the board. Rack up the points.</footer>
<dialog id="strike-overlay" aria-labelledby="strike-title"><button id="dismiss-strikes" class="overlay-content"><span id="strike-title" class="eyebrow">WRONG ANSWER</span><span id="overlay-xs" class="big-xs"></span><span id="overlay-message">Click anywhere here to continue</span></button></dialog>
</body>
</html>
